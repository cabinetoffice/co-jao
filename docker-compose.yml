
services:
  jao-backend:
    build:
      context: .
      dockerfile: ./jao-backend/Dockerfile.dev
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  
    env_file:
      - .env
    environment:
      - ENV=dev
      - PYTHONPATH=/app/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - JAO_BACKEND_SUPERUSER_USERNAME=${JAO_BACKEND_SUPERUSER_USERNAME:-admin_local}
      - JAO_BACKEND_SUPERUSER_EMAIL=${JAO_BACKEND_SUPERUSER_EMAIL:-admin_local@example.com}
      - JAO_BACKEND_SUPERUSER_PASSWORD=${JAO_BACKEND_SUPERUSER_PASSWORD:-admin123} 
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-2}
    volumes:
      # Mount source code for hot reloading during development
      - ./jao-backend/src:/app/src
    depends_on:
      - db
      - skills-worker
      - redis
    networks:
      - jao-network

  jao-worker:
    build:
      context: .
      dockerfile: ./jao-backend/Dockerfile.dev
    command: poetry run celery -A jao_backend.common.celery worker --loglevel=INFO -Q celery
    env_file:
      - .env
    environment:
      - ENV=dev
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-2}
    volumes:
      - ./jao-backend/src:/app/src
    depends_on:
      - db
      - redis
    networks:
      - jao-network

  jao-beat:
    build:
      context: .
      dockerfile: ./jao-backend/Dockerfile.dev
    command: poetry run celery -A jao_backend.common.celery beat --loglevel=INFO
    env_file:
      - .env
    environment:
      - ENV=dev
      - PYTHONPATH=/app/src
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-2}
    volumes:
      - ./jao-backend/src:/app/src
    depends_on:
      - db
      - redis
    networks:
      - jao-network

  jao-web:
    build:
      context: .
      dockerfile: ./jao-web/Dockerfile.dev
    ports:
      - "8001:8000"  # Different port to avoid conflict
    env_file:
      - .env
    environment:
      - ENV=dev
      - PYTHONPATH=/app/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Add API endpoint for backend communication
      - REDIS_HOST=redis
    volumes:
      # Mount source code for hot reloading during development
      - ./jao-web/src:/app/src
    depends_on:
      - jao-backend
      - redis
    networks:
      - jao-network

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jao_dev
      POSTGRES_USER: jao_user
      POSTGRES_PASSWORD: jao_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jao-network

  # Optional: Redis for caching/sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jao-network

  skills-worker:
        platform: linux/arm64
        build:
          context: .
          dockerfile: ./skills-worker/Dockerfile
        command: celery -A skills_extraction.skills_celery_app worker --loglevel=INFO -Q skills_queue
        env_file:
          - .env
        environment:
          - ENV=dev
          - PYTHONPATH=/app
          - CELERY_BROKER_URL=redis://redis:6379/0 
          - CELERY_RESULT_BACKEND=redis://redis:6379/0
          - POSTGRES_DB=jao_dev
          - POSTGRES_USER=jao_user
          - POSTGRES_PASSWORD=jao_password
          - POSTGRES_HOST=db
          - POSTGRES_PORT=5432
          - OMP_NUM_THREADS=1
          - MKL_NUM_THREADS=1
          - TOKENIZERS_PARALLELISM=false
        depends_on:
          - db
          - redis
        networks:
          - jao-network

volumes:
  postgres_data:
  redis_data:

networks:
  jao-network:
    driver: bridge
