services:
  jao-backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./jao-backend/Dockerfile
    # ponytail: batch engine has no server; exec in to run pipeline commands.
    # Overrides the image's CMD (run_weekly_pipeline) so `up` cannot start a real ingest.
    command: sleep infinity
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ENV=dev
      - PYTHONPATH=/app/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - JAO_BACKEND_SUPERUSER_USERNAME=${JAO_BACKEND_SUPERUSER_USERNAME:-admin_local}
      - JAO_BACKEND_SUPERUSER_EMAIL=${JAO_BACKEND_SUPERUSER_EMAIL:-admin_local@example.com}
      - JAO_BACKEND_SUPERUSER_PASSWORD=${JAO_BACKEND_SUPERUSER_PASSWORD:-admin123}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-2}
      - SKILLS_WORKER_URL=http://skills-worker:5000
    volumes:
      - ./jao-backend/src:/app/src
    depends_on:
      - db
      - skills-worker
    networks:
      - jao-network

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jao_dev
      POSTGRES_USER: jao_user
      POSTGRES_PASSWORD: jao_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jao-network

  skills-worker:
    platform: linux/arm64
    build:
      context: .
      dockerfile: ./skills-worker/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ENV=dev
      - PYTHONPATH=/app
      - PORT=5000
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
    networks:
      - jao-network

volumes:
  postgres_data:

networks:
  jao-network:
    driver: bridge
