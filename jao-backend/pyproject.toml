[tool.poetry]
name = "jao_data_engine"
version = "0.1.0"
description = "JAO Data Engine - Weekly data ingestion and embedding generation"
authors = [
    "Anthoni Gleeson <anthoni.gleeson@digital.trade.gov.uk>",
    "Stuart Axon stuart.axon@digital.cabinet-office.gov.uk",
    "Tommy Sarosi tomas.sarosi@cabinet-office.gov.uk",
]
readme = "README.md"
license = "MIT"

packages = [{ include = "jao_backend", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<=3.13"

# Django core
django = ">=5.0.1,<5.0.15"
python-dotenv = "^1.0.1"
dj-database-url = "^2.1.0"

# Database
psycopg2-binary = "^2.9.10"
pgvector = "^0.4.1"
mssql-django = "^1.6"
django-polymorphic = "^3.1.0"

# AWS
boto3 = "^1.34.64"

# LLM / Embeddings
litellm = "^1.76.3"
sentence-transformers = "^5.2.0"

# ML / Clustering
scikit-learn = "^1.8.0"
umap-learn = "^0.5.11"
hdbscan = "^0.8.41"
numpy = "2.2"

# HTTP client (for skills-worker communication)
httpx = "^0.28.0"

# Data validation
pydantic = "^2.7.4"
jao-backend-schemas = { url = "https://github.com/cabinetoffice/co-jao/releases/download/v0.0.7/jao_backend_schemas-0.1.0-py3-none-any.whl" }

# Text processing
bbcode = "^1.1.0"

# Utilities
structlog = "^25.4.0"
cachedmethod = "^0.1.0"
cachemethod = "^1.0.0"
djantic2 = "^1.0.5"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-django = "^4.11.1"
pytest-env = "^1.1.5"
pytest-unordered = "^0.6.1"
faker = "^37.1.0"
factory-boy = "^3.3.3"
pre-commit = "^3.7.0"
black = "^24.3.0"
django-extensions = "^3.2.3"

[tool.poetry.scripts]
manage = "django.core.management:execute_from_command_line"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jao_backend.settings.test"
env = ["ENV=test"]
pythonpath = ["src"]
